[package]
name = "dsh-remote-companion"
version = "0.1.0"
description = "Portable desktop companion for the dsh-remote-control console"
authors = ["TurboKre"]
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "dsh_remote_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.30"
futures-util = "0.3"
base64 = "0.22"
rand = "0.9"
sha2 = "0.10"
libloading = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61", features = ["Win32_Media_Audio"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
javascriptcore-rs = "1.1.2"
webkit2gtk = { version = "2", features = ["v2_40"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
lto = true
codegen-units = 1
