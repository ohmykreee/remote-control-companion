# Shared quality gate. Everything runs on Ubuntu, independently of the
# platform builds:
#   * svelte-check and the production frontend build
#   * cargo fmt and clippy (static Rust checks)
#   * the native Linux Rust test suite
#
# `pnpm build` must run before the Rust tests: the Tauri context embeds the
# production `dist/` assets at compile time. The GTK/WebKit development headers
# are installed because the Tauri Linux backend links against them even for
# tests that never open a window.
name: Checks

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: checks (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26.7.0
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          toolchain: 1.99.1
          cache: false

      - name: Add Rust lint tools
        run: rustup component add clippy rustfmt

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Typecheck frontend
        run: pnpm check

      - name: Build production frontend
        run: pnpm build

      - name: Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Rust lints
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings

      - name: Compile Rust tests
        run: pnpm run test:rust:compile

      - name: Run Rust tests
        run: pnpm run test:rust
