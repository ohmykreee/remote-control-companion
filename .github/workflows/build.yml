# Portable builds for the supported x64 targets.
#
# Checks are the shared Ubuntu gate. Packaging runs only for pushes to main and
# manual dispatches; pull requests stop after the gate. Each target uses a
# native runner: Windows x64 and Linux x64 build against their own system
# WebView, rather than carrying a cross-compilation sysroot. Every archive is
# uploaded as an artifact. There is intentionally no release publication
# workflow yet.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    uses: ./.github/workflows/checks.yml

  portable:
    name: portable (${{ matrix.name }})
    if: github.event_name != 'pull_request'
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: win-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: DSHRemoteCompanion.exe
            linux: false
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: DSHRemoteCompanion
            linux: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26.7.0
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
        with:
          toolchain: 1.99.1
          target: ${{ matrix.target }}
          cache: false

      - name: Install Tauri Linux dependencies
        if: matrix.linux
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libssl-dev zip unzip

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Build portable binary
        run: pnpm tauri build --no-bundle --target ${{ matrix.target }}

      - name: Assemble portable package
        run: node scripts/assemble-portable.mjs --target ${{ matrix.target }}

      - name: Verify portable package
        run: |
          root="release/DSH-Remote-Companion-${{ matrix.name }}"
          zip="release/DSH-Remote-Companion-${{ matrix.name }}.zip"
          test -f "$root/${{ matrix.binary }}"
          test -d "$root/Data"
          test -f "$zip"
          ls -lh "$root/${{ matrix.binary }}" "$zip"

      - name: Upload portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: DSH-Remote-Companion-${{ matrix.name }}
          path: release/DSH-Remote-Companion-${{ matrix.name }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
